name: Build, Test and Release master
on:
  push:
    branches: [master]
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - id: version
        run: |
          npm ci
          cp ci/justversion.releaserc.json .releaserc.json
          npx semantic-release
          if [ -f .version ]; then echo "version=$(cat .version)" >> "$GITHUB_OUTPUT"; fi
  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      build_version: ${{ needs.version.outputs.version }}
  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
      - name: Semantic Release
        run: |
          npm ci
          cp ci/full.releaserc.json .releaserc.json
          npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
